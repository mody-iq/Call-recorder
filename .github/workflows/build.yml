name: Build RootHide CallRecorder Tweak

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: /Users/runner/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid dpkg make xz
          if [ -d "/opt/homebrew/opt/make/libexec/gnubin" ]; then
            echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH
          elif [ -d "/usr/local/opt/make/libexec/gnubin" ]; then
            echo "/usr/local/opt/make/libexec/gnubin" >> $GITHUB_PATH
          fi

      - name: Clone RootHide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"

      - name: Download and install patched iOS SDKs
        run: |
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -R /tmp/theos-sdks/*.sdk "$THEOS/sdks/"
          rm -rf /tmp/theos-sdks

      - name: Syntax check prefs
        run: |
          echo "=== SYNTAX CHECK callrecorderprefs ==="
          xcrun --sdk iphoneos clang -x objective-c -fsyntax-only -fobjc-arc -I$THEOS/include -I$THEOS/vendor/include -I. -Icallrecorderprefs -F$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks callrecorderprefs/CRPRootListController.m 2>&1 | tee syntax.log || true
          cat syntax.log
          echo "=== END SYNTAX ==="
          while IFS= read -r line; do echo "::warning::$line"; done < syntax.log

      - name: Build RootHide .deb package
        run: |
          chmod 0755 layout/DEBIAN/postinst
          set -o pipefail
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide messages=yes 2>&1 | tee build.log
          echo "=== BUILD LOG ==="
          cat build.log
          ls -lh packages/ || true

      - name: Upload .deb artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CallRecorder-RootHide-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "## Build failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -i "error" build.log | tail -n 100 >> $GITHUB_STEP_SUMMARY || tail -n 200 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "## Syntax" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat syntax.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "::group::Errors"
          grep -i "error" build.log | tail -n 20 | while IFS= read -r l; do echo "::error::$l"; done || true
          tail -n 80 build.log | while IFS= read -r l; do echo "::error::$l"; done || true
          echo "::endgroup::"

      - name: Post PR comment with errors
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let b=''; try{b=fs.readFileSync('build.log','utf8')}catch(e){b='no log'}
            let s=''; try{s=fs.readFileSync('syntax.log','utf8')}catch(e){}
            let tail=b.split('\n').filter(l=>l.toLowerCase().includes('error')).slice(-30).join('\n') || b.slice(-5000);
            let body='❌ **Build failed**\n```\n'+tail+'\n```\n**Syntax**\n```\n'+s.slice(-2000)+'\n```';
            github.rest.issues.createComment({owner:context.repo.owner, repo:context.repo.repo, issue_number:context.issue.number, body});
