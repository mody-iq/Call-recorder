name: Build RootHide CallRecorder Tweak

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: /Users/runner/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid dpkg make xz
          if [ -d "/opt/homebrew/opt/make/libexec/gnubin" ]; then
            echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH
          elif [ -d "/usr/local/opt/make/libexec/gnubin" ]; then
            echo "/usr/local/opt/make/libexec/gnubin" >> $GITHUB_PATH
          fi

      - name: Clone RootHide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"

      - name: Download and install patched iOS SDKs
        run: |
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -R /tmp/theos-sdks/*.sdk "$THEOS/sdks/"
          rm -rf /tmp/theos-sdks

      - name: Syntax check prefs
        run: |
          xcrun --sdk iphoneos clang -x objective-c -fsyntax-only -fobjc-arc -I$THEOS/include -I$THEOS/vendor/include -I. -Icallrecorderprefs -F$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks callrecorderprefs/CRPRootListController.m 2>&1 | tee syntax.log || true
          cat syntax.log

      - name: Build RootHide .deb package
        run: |
          chmod 0755 layout/DEBIAN/postinst
          set -o pipefail
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide messages=yes 2>&1 | tee build.log
          cat build.log
          ls -lh packages/ || true

      - name: Extract linker errors
        if: failure()
        run: |
          echo "=== LINKER ERRORS ==="
          grep -i "undefined\|Undefined\|symbol.*not found\|ld:.*error\|clang.*error" build.log || true
          grep -i "undefined" build.log | head -n 20 | while read l; do echo "::error::$l"; done || true
          echo "--- last 60 ---"
          tail -n 60 build.log
          tail -n 60 build.log | while IFS= read -r l; do echo "::error::$l"; done || true

      - name: Post PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let b=''; try{b=fs.readFileSync('build.log','utf8')}catch(e){}
            let out=b.split('\n').filter(l=>l.includes('Undefined')||l.includes('undefined')||l.includes('ld:')||l.includes('error:')).slice(-40).join('\n') || b.slice(-4000);
            await github.rest.issues.createComment({owner:context.repo.owner, repo:context.repo.repo, issue_number:context.issue.number, body:'❌ **Linker error**\n```\n'+out+'\n```'});

      - name: Upload .deb artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CallRecorder-RootHide-deb
          path: packages/*.deb
          if-no-files-found: error
