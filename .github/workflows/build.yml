name: Build RootHide CallRecorder Tweak

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: /Users/runner/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid dpkg make xz
          if [ -d "/opt/homebrew/opt/make/libexec/gnubin" ]; then
            echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH
          elif [ -d "/usr/local/opt/make/libexec/gnubin" ]; then
            echo "/usr/local/opt/make/libexec/gnubin" >> $GITHUB_PATH
          fi

      - name: Clone RootHide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"

      - name: Download and install patched iOS SDKs
        run: |
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -R /tmp/theos-sdks/*.sdk "$THEOS/sdks/"
          rm -rf /tmp/theos-sdks

      - name: Build RootHide .deb package
        run: |
          chmod 0755 layout/DEBIAN/postinst
          set -o pipefail
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide messages=yes 2>&1 | tee build.log
          ls -lh packages/

      - name: Upload .deb artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CallRecorder-RootHide-deb
          path: packages/*.deb
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Post build log to summary
        if: always()
        run: |
          echo "## Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build.log | head -n 300 >> $GITHUB_STEP_SUMMARY || echo "no log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create gist with build log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f build.log ]; then
            # Use gh to create gist (public) with build log
            gh gist create build.log --public --desc "build log ${{ github.sha }}" || true
            # Also post to commit comment via API directly (fallback)
            LOG=$(cat build.log | head -c 4000 | sed 's/"/\\u0022/g' | tr -d '\n' | cut -c1-4000)
            curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" \
              -d "{\"body\":\"Build failed log (first 4k chars):\n\`\`\`\n$(cat build.log | head -n 80 | sed 's/\"/\\u0022/g')\n\`\`\`\"}" \
              https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments || true
          fi

      - name: Report build failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch(e) { log = 'no build.log'; }
            log = log.slice(0, 6000);
            const body = `**Build failed** for commit ${context.sha}\n\`\`\`\n${log}\n\`\`\``;
            if (context.payload.pull_request) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: body
              });
            }
