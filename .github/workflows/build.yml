name: Build RootHide CallRecorder Tweak

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: /Users/runner/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid dpkg make xz
          if [ -d "/opt/homebrew/opt/make/libexec/gnubin" ]; then
            echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH
          elif [ -d "/usr/local/opt/make/libexec/gnubin" ]; then
            echo "/usr/local/opt/make/libexec/gnubin" >> $GITHUB_PATH
          fi

      - name: Clone RootHide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"

      - name: Download and install patched iOS SDKs
        run: |
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -R /tmp/theos-sdks/*.sdk "$THEOS/sdks/"
          rm -rf /tmp/theos-sdks

      - name: Build RootHide .deb package
        run: |
          chmod 0755 layout/DEBIAN/postinst
          set -o pipefail
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide messages=yes 2>&1 | tee build.log
          cat build.log | grep -A 10 "Undefined symbols" || true
          ls -lh packages/ || true

      - name: Diagnostics
        if: failure()
        run: |
          echo "=== FULL undefined context ==="
          grep -n "Undefined" build.log || true
          grep -A 12 "Undefined symbols" build.log || true
          echo "--- last 120 ---"
          tail -n 120 build.log
          # emit as errors
          grep -A 8 "Undefined symbols" build.log | while read l; do echo "::error::$l"; done || true
          tail -n 80 build.log | while read l; do echo "::error::$l"; done || true

      - name: Post PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let b=''; try{b=fs.readFileSync('build.log','utf8')}catch(e){}
            let u=''; try{const m=b.match(/Undefined symbols[\s\S]{0,800}/); u=m?m[0]:''}catch(e){}
            let tail=b.slice(-5000);
            await github.rest.issues.createComment({owner:context.repo.owner, repo:context.repo.repo, issue_number:context.issue.number, body:'❌ **Linker**\n```\n'+u+'\n---\n'+tail.slice(-2500)+'\n```'});

      - name: Upload .deb artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CallRecorder-RootHide-deb
          path: packages/*.deb
          if-no-files-found: error
